server {
    listen 127.0.0.1:8080;
    server_name localhost 127.0.0.1;

    root "moodle";
    index index.php index.html index.htm;

    # 1. Block access to hidden files and folders (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
        return 403;
    }

    # 2. Block access to sensitive configuration files
    location ~* \.(env|git|lock|yml|yaml|bak|config|sql)$ {
        deny all;
        return 403;
    }

    # 3. Block access to moodledata, temp, and cache folders
    location ~* /(moodledata|temp|cache)/ {
        deny all;
        return 404;
    }

    # 4. Standard Moodle routing with slasharguments support
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # 5. FastCGI PHP execution with slasharguments
    location ~ [^/]+\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }
}
